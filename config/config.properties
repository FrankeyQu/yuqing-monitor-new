# DeepSeek AI 配置（蒙语/维语舆情分析用）
deepseek.api.url = ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
deepseek.api.key = ${DEEPSEEK_API_KEY:}

# 百度千帆 AI 搜索配置（汉语网页 + 蒙语/维语采集用）
baidu.api.key = ${BAIDU_API_KEY:}
baidu.api.url = ${BAIDU_API_URL:https://qianfan.baidubce.com/v2/ai_search/web_search}

# 内容提取配置（百度搜索结果摘要→全文提取，可选）
content.extraction.enabled = ${CONTENT_EXTRACTION_ENABLED:false}
content.extraction.provider = ${CONTENT_EXTRACTION_PROVIDER:jina}
jina.reader.api.url = ${JINA_READER_API_URL:https://r.jina.ai}
jina.reader.api.key = ${JINA_READER_API_KEY:}
jina.reader.credential-ref = ${JINA_READER_CREDENTIAL_REF:JINA_READER_API_KEY}
jina.reader.timeout-ms = ${JINA_READER_TIMEOUT_MS:15000}
jina.reader.max-content-length = ${JINA_READER_MAX_CONTENT_LENGTH:20000}

nlp.service.open=${NLP_SERVICE_OPEN:false}

nlp.service.url=${NLP_SERVICE_URL:}

nlp.service.username = ${NLP_SERVICE_USERNAME:}

npl.service.password = ${NLP_SERVICE_PASSWORD:}
